# NeuroDrift reverse proxy: /api -> FastAPI, everything else -> Next.js.
server {
    listen 80;
    server_name _;

    client_max_body_size 510m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # No route here contains "..". nginx would resolve it for routing but forward the raw path,
    # which Next.js answers with a 500, so reject such requests up front.
    if ($request_uri ~* "(\.\.|%2e%2e|%2e\.|\.%2e)") {
        return 400;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads straight to the backend instead of buffering to disk twice.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
