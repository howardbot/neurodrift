# NeuroDrift — single-host deployment (2 CPU / 8 GB is enough).
# Usage: cp .env.example .env && docker compose up -d --build
name: neurodrift

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neurodrift}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-neurodrift}
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  MAX_SESSIONS_PER_PROJECT: ${MAX_SESSIONS_PER_PROJECT:-30}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurodrift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-neurodrift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence so queued jobs survive a Redis restart; the worker also
    # re-queues orphaned experiments when it starts.
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "128mb"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    command: ["api"]
    environment: *backend-env
    volumes:
      - datasets:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2g

  # One worker = one analysis at a time; jobs run in a forked child process.
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["worker"]
    environment: *backend-env
    volumes:
      - datasets:/data
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  datasets:
  redisdata:
